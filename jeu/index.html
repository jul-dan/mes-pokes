<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mes p'tits compagnons</title>
<meta name="description" content="Jeu éducatif de maternelle : chiffres, lettres, formes… et des compagnons qui évoluent !">
<meta name="theme-color" content="#8b6cf0"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest?v=2"><link rel="icon" href="favicon.png" type="image/png" sizes="64x64"><link rel="icon" href="icon-192.png" sizes="192x192"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>/* Monde : un ciel de jardin du matin, gros boutons ronds comme des galets de couleur.
   Thème unique et lumineux, choisi exprès (jeu pour enfant) : toutes les couleurs sont explicites. */
:root{
  --sky1:#bfe6ff; --sky2:#fff1d6; --ink:#2d2350; --ink-soft:#5b5480;
  --card:#ffffff; --sun:#ffc93c; --grass:#7ed37a; --coral:#ff7a6b; --violet:#8b6cf0;
  --ok:#3cc47c; --hint:#ffd84a;
  --font-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-print:"Arial Black","Arial",Helvetica,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{overscroll-behavior:none}
body{background:linear-gradient(180deg,var(--sky1),var(--sky2));color:var(--ink);font-family:var(--font-display);
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit}
#app{position:relative;width:100%;height:100%;max-width:560px;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}

/* décor */
.hills{position:absolute;left:0;right:0;bottom:0;height:22%;pointer-events:none;z-index:0}
.cloud{position:absolute;pointer-events:none;opacity:.85;animation:drift 40s linear infinite;z-index:0}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(120vw)}}

/* boutons */
.big{border:0;border-radius:32px;background:var(--card);box-shadow:0 6px 0 rgba(45,35,80,.18),0 10px 24px rgba(45,35,80,.12);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.big:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 rgba(45,35,80,.18)}
.big:focus-visible,.choice:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
.round{width:64px;height:64px;border-radius:50%;padding:0}
.round>svg{width:34px;height:34px}
.play{width:min(72vw,300px);height:110px;background:linear-gradient(180deg,#5fdc8f,#2fb36a);color:#fff}
.play>svg{width:64px;height:64px}
.topbar{position:relative;z-index:3;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:64px}
.topbar .mid{flex:1;display:flex;justify-content:center;gap:8px;min-width:0}

/* accueil */
.logo{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:transparent;border:0;padding:0}
.logo>svg{width:56px;height:56px}
.home-stage{position:relative;z-index:2;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0}
.pet{position:relative;width:min(70vw,300px);aspect-ratio:1;max-height:42vh;cursor:pointer}
.pet>svg{width:100%;height:100%;overflow:visible}
.pet.s1{width:min(56vw,230px)} .pet.s2{width:min(64vw,265px)}
.xpbar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:300px}
.xpbar .st, .xpbar .st>svg{width:26px;height:26px}
.home-actions{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.row{display:flex;gap:18px;justify-content:center;align-items:center}
.square{width:110px;height:96px;position:relative}
.square>svg{width:62px;height:62px}
.badge{position:absolute;top:-8px;right:-8px;min-width:34px;height:34px;border-radius:17px;background:var(--coral);color:#fff;
  font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;padding:0 8px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.wiggle{animation:wiggle 1.4s ease-in-out infinite}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-7deg)}80%{transform:rotate(7deg)}90%{transform:rotate(-4deg)}}

/* créatures */
.crt .eye{animation:blink 4.6s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.crt .mo-happy{display:none} .crt.happy .mo-happy{display:inline} .crt.happy .mo-calm{display:none}
.crt .flick{animation:flick 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.92,1.1)}}
.crt .bob{animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.crt .twinkle{animation:tw 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
.crt .floaty{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%{transform:translateY(8px);opacity:0}30%{opacity:.9}100%{transform:translateY(-40px);opacity:0}}
.hop{animation:hop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0) scale(1)}25%{transform:translateY(4%) scale(1.08,.9)}55%{transform:translateY(-16%) scale(.95,1.06)}100%{transform:translateY(0) scale(1)}}

/* choix compagnon */
.title{position:relative;z-index:2;font-size:30px;font-weight:700;text-align:center;margin:6px 0 4px;text-wrap:balance}
.grid4{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:420px;flex:1;align-content:center}
.pick{aspect-ratio:1;border-radius:36px;padding:6px;border:0;position:relative;transition:transform .25s,opacity .25s,filter .25s}
.pick>svg{width:100%;height:100%}
.pick.dim{opacity:.45;filter:saturate(.6);transform:scale(.92)}
.pick.sel{transform:scale(1.06);box-shadow:0 0 0 6px #fff,0 0 0 12px var(--sun),0 12px 30px rgba(0,0,0,.2)}
.ok-btn{width:120px;height:96px;background:linear-gradient(180deg,#5fdc8f,#2fb36a);color:#fff}
.ok-btn>svg{width:60px;height:60px}

/* jeu */
.dots{display:flex;gap:7px;align-items:center}
.dot{width:16px;height:16px;border-radius:50%;background:rgba(45,35,80,.15)}
.dot.done{background:var(--sun);box-shadow:0 0 0 3px #fff}
.dot.cur{background:#fff;box-shadow:0 0 0 3px var(--sun)}
.stage{position:relative;z-index:2;flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(44px,9vh,80px);min-height:0}
.prompt{width:100%;display:flex;justify-content:center;align-items:center;min-height:0}
.prompt:empty{display:none}
.panel{background:rgba(255,255,255,.85);border-radius:28px;padding:12px;box-shadow:0 6px 18px rgba(45,35,80,.1);max-width:100%}
.choices{display:grid;gap:14px;width:100%;max-width:440px}
.choices.c2{grid-template-columns:1fr 1fr}
.choices.c3{grid-template-columns:1fr 1fr 1fr}
.choices.c4{grid-template-columns:1fr 1fr}
.choice{border:0;background:var(--card);border-radius:30px;aspect-ratio:1;min-height:0;padding:10px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 0 rgba(45,35,80,.16),0 10px 22px rgba(45,35,80,.1);transition:transform .15s,opacity .3s,box-shadow .2s;cursor:pointer;position:relative}
.choices.c3 .glyph{font-size:min(19vw,80px)}
.choices.c3 .choice{padding:6px;border-radius:24px}
.choice:active{transform:translateY(3px) scale(.97)}
.choice>svg{width:100%;height:100%;display:block}
.choice>div>svg{width:100%;height:100%;display:block}
.choice .glyph{font-family:var(--font-print);font-size:min(30vw,120px);line-height:1;font-weight:900}
.choice.right{box-shadow:0 0 0 6px var(--ok),0 10px 26px rgba(60,196,124,.5);animation:pop .5s}
.choice.nope{animation:nope .45s;opacity:.55}
.choice.shine{animation:shine 1s ease-in-out infinite;z-index:2}
.choice.off{pointer-events:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes shine{0%,100%{box-shadow:0 0 0 6px var(--hint),0 0 30px 6px rgba(255,216,74,.8);transform:scale(1.03)}50%{box-shadow:0 0 0 10px var(--hint),0 0 46px 14px rgba(255,216,74,.95);transform:scale(1.08)}}
.mascot{position:absolute;left:4px;bottom:calc(4px + env(safe-area-inset-bottom,0px));width:92px;height:92px;z-index:4;pointer-events:none}
.mascot>svg{width:100%;height:100%;overflow:visible}

/* tracé */
.trace-wrap{position:relative;width:min(92vw,calc(100dvh - 330px),440px);min-width:220px;aspect-ratio:1;border-radius:32px;background:#fff;box-shadow:0 8px 24px rgba(45,35,80,.14);touch-action:none}
.trace-wrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:32px;touch-action:none}
.phase{display:flex;gap:10px}
.phase i{width:44px;height:12px;border-radius:6px;background:rgba(45,35,80,.15)}
.phase i.on{background:var(--violet)}

/* fin */
.trophy{width:min(60vw,240px)}

/* cartes */
.card{--rx:0deg;--ry:0deg;position:relative;width:150px;aspect-ratio:5/7;perspective:900px}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,.7,.2,1);
  transform:rotateX(var(--rx)) rotateY(calc(var(--ry) + 180deg));will-change:transform}
.card.up .inner{transform:rotateX(var(--rx)) rotateY(var(--ry))}
.card.tilting .inner{transition:transform .08s linear}
.face{position:absolute;inset:0;border-radius:14px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(.1px)}
.face.back{transform:rotateY(180deg) translateZ(.1px)}
.front .art{flex:1;border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.front .art>svg{width:104%;height:104%}
.front .nm{font-weight:700;font-size:15px;text-align:center;color:#fff;text-shadow:0 1px 0 rgba(45,35,80,.55),0 0 6px rgba(45,35,80,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.front .stars{display:flex;justify-content:center;gap:3px;height:14px}
.front .stars>svg{height:14px;width:14px}
.front .el{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center}
.front .el>svg{width:17px;height:17px}
.glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
  background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.55),rgba(255,255,255,0) 50%)}
.holo{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.2;
  background:linear-gradient(115deg,transparent 20%,#ff9de2 35%,#9df3ff 45%,#fff59d 55%,transparent 70%);background-size:250% 250%;animation:holo 4s linear infinite}
.gold .holo{opacity:.3;background:linear-gradient(115deg,transparent 15%,#fff6c2 35%,#ffd34d 45%,#fff 52%,transparent 70%);background-size:250% 250%}
@keyframes holo{from{background-position:120% 0}to{background-position:-120% 0}}
.cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;padding-bottom:20px}
.cardgrid .card{width:100%}
.slot{aspect-ratio:5/7;border-radius:14px;background:rgba(255,255,255,.45);border:3px dashed rgba(45,35,80,.18);display:flex;align-items:center;justify-content:center}
.slot>svg{width:70%;opacity:.25}
.count{position:absolute;bottom:-6px;right:-6px;z-index:3;background:var(--violet);color:#fff;border-radius:12px;min-width:26px;height:24px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.scroll{position:relative;z-index:2;flex:1;overflow-y:auto;width:100%;-webkit-overflow-scrolling:touch;padding:6px 2px}
.zoom{position:fixed;inset:0;z-index:40;background:rgba(30,20,60,.72);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
.zoom .card{width:min(72vw,300px)}
.zoom .card .nm{font-size:26px}
.zoom .card .stars{height:22px}.zoom .card .stars svg{width:22px;height:22px}
.zoom .card .el{width:38px;height:38px}.zoom .card .el svg{width:28px;height:28px}

/* paquet */
.pack{width:min(56vw,230px);aspect-ratio:3/4.2;cursor:pointer;position:relative}
.pack>svg{width:100%;height:100%}
.pack.shake{animation:shake .5s ease-in-out 2}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg) scale(1.03)}40%{transform:rotate(6deg) scale(1.05)}60%{transform:rotate(-4deg)}80%{transform:rotate(4deg)}}
.pack.burst{animation:burst .6s forwards}
@keyframes burst{to{transform:scale(1.6);opacity:0}}
.packcards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;width:100%}
.packcards .card{width:min(40vw,165px);animation:dealin .6s backwards cubic-bezier(.2,1.4,.4,1)}
.packcards .card:nth-child(2){animation-delay:.15s}.packcards .card:nth-child(3){animation-delay:.3s}
@keyframes dealin{from{transform:translateY(-60px) scale(.4);opacity:0}}
.rays{position:absolute;inset:-60%;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(255,240,170,.55) 0 10deg,rgba(255,255,255,0) 10deg 20deg);
  animation:spin 8s linear infinite;border-radius:50%;-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%)}
@keyframes spin{to{transform:rotate(360deg)}}
.gold-glow{box-shadow:0 0 0 4px #ffe27a,0 0 34px 10px rgba(255,214,77,.85)!important;border-radius:14px}

/* évolution */
#evo{position:fixed;inset:0;z-index:50;background:radial-gradient(circle,#3a2a7a,#140c30);display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
#evo .evo-box{position:relative;width:min(80vw,340px);aspect-ratio:1}
#evo .evo-box>div{position:absolute;inset:0}
#evo .evo-box>div>svg{width:100%;height:100%;overflow:visible}
#evo .sil>svg{filter:brightness(0) invert(1) drop-shadow(0 0 18px #fff)}
#evo .flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#evo .ring{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;border:4px solid rgba(255,255,255,.9);animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(24);opacity:0}}
.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 10px 4px #fff7c0}

/* parent */
.parent{position:fixed;inset:0;z-index:60;background:#f6f4ff;overflow-y:auto;font-family:system-ui,sans-serif;color:var(--ink);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));user-select:text;-webkit-user-select:text}
.parent h2{font-family:var(--font-display);font-size:24px;margin:4px 0 12px}
.parent section{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(45,35,80,.08)}
.parent h3{margin:0 0 8px;font-size:16px}
.parent label{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:16px}
.parent input[type=text],.parent select{font-size:18px;padding:8px 10px;border-radius:10px;border:2px solid #d9d3f5;width:100%;max-width:340px;background:#fff;color:var(--ink)}
.parent input[type=checkbox]{width:24px;height:24px;accent-color:var(--violet)}
.parent input[type=range]{width:100%;max-width:340px;accent-color:var(--violet)}
.parent .pbtn{font-size:16px;padding:10px 16px;border-radius:12px;border:0;background:var(--violet);color:#fff;font-weight:600;cursor:pointer;margin:4px 6px 4px 0}
.parent .pbtn.warn{background:#e0524a}
.parent .pbtn.ghost{background:#e9e5ff;color:var(--ink)}
.parent .small{font-size:13px;color:var(--ink-soft);margin:4px 0}
.parent .stats{font-size:14px;line-height:1.6}
.parent .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.press-ring{position:fixed;width:80px;height:80px;border-radius:50%;border:5px solid rgba(139,108,240,.6);pointer-events:none;z-index:70;transform:scale(.4);opacity:0;transition:transform 1.8s linear,opacity .2s}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:45}
/* ====== Revamp : écrans, créatures, combat, sous-titres ====== */
.screen.enter{animation:scrIn .42s cubic-bezier(.2,.9,.3,1.15)}
@keyframes scrIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.big{transition:transform .14s cubic-bezier(.3,1.6,.5,1),box-shadow .14s,filter .2s}
@media (hover:hover){.big:hover{filter:brightness(1.05);transform:translateY(-2px)}}
.play{position:relative;overflow:hidden;animation:breathe 2.4s ease-in-out infinite}
.play::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);background-size:250% 100%;animation:sheen 3s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes sheen{0%,40%{background-position:130% 0}100%{background-position:-130% 0}}
.lbl{display:block;font-size:14px;font-weight:700;color:var(--ink-soft);margin-top:4px;text-align:center}
.btn-col{display:flex;flex-direction:column;align-items:center}
.pet{filter:drop-shadow(0 10px 14px rgba(45,35,80,.18))}
.pet.s3{filter:drop-shadow(0 0 22px rgba(255,220,120,.6)) drop-shadow(0 10px 14px rgba(45,35,80,.2))}
.pet-name{position:relative;z-index:2;font-size:22px;font-weight:700;background:rgba(255,255,255,.75);padding:4px 16px;border-radius:20px;box-shadow:0 3px 0 rgba(45,35,80,.12);display:flex;gap:8px;align-items:center}
.pet-name .stg{font-size:13px;background:var(--violet);color:#fff;border-radius:10px;padding:2px 8px}
.xpbar .st{transition:transform .3s}.xpbar .st.on{animation:starOn .6s backwards}
@keyframes starOn{from{transform:scale(0) rotate(-90deg)}}
/* effets des créatures (niveaux 2 et 3) */
.crt .fx-orbit{animation:orbit 5s linear infinite;transform-box:view-box;transform-origin:100px 118px}
.crt .fx-orbit.rev{animation-direction:reverse;animation-duration:7s}
@keyframes orbit{to{transform:rotate(360deg)}}
.crt .fx-spin{animation:orbit 14s linear infinite;transform-box:view-box;transform-origin:100px 118px}
.crt .fx-spin.rev{animation-direction:reverse;animation-duration:20s}
.crt .fx-pulse{animation:fxpulse 2.4s ease-in-out infinite;transform-box:view-box;transform-origin:100px 118px}
@keyframes fxpulse{0%,100%{transform:scale(.94);opacity:.75}50%{transform:scale(1.06);opacity:1}}
.crt .fx-rise{animation:fxrise 2.6s ease-in infinite;transform-box:fill-box;transform-origin:center}
@keyframes fxrise{0%{transform:translateY(10px) scale(.4);opacity:0}25%{opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}
.crt .fx-breath{animation:breath 3.2s ease-in-out infinite;transform-box:view-box;transform-origin:100px 180px}
@keyframes breath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.025,.975)}}
/* combat */
.arena{position:relative;z-index:3;width:100%;max-width:460px;height:clamp(78px,15vh,120px);display:flex;justify-content:space-between;align-items:flex-end;margin-top:clamp(6px,2.5vh,22px);
  background:radial-gradient(ellipse 30% 22% at 18% 88%,rgba(45,35,80,.12),transparent 70%),radial-gradient(ellipse 30% 22% at 82% 88%,rgba(45,35,80,.12),transparent 70%)}
.fighter{position:relative;height:100%;aspect-ratio:1}
.fighter>svg{width:100%;height:100%;overflow:visible}
.fighter.foe>svg{transform:scaleX(-1)}
.hp{position:absolute;left:8%;right:8%;top:-4px;height:10px;border-radius:6px;background:rgba(45,35,80,.18);overflow:hidden;box-shadow:0 0 0 2px #fff;z-index:2}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#3cc47c,#8be06a);border-radius:6px;transition:width .6s cubic-bezier(.3,1.3,.5,1),background .3s}
.hp.mid i{background:linear-gradient(90deg,#ffb020,#ffd84a)}.hp.low i{background:linear-gradient(90deg,#ff5a4a,#ff9a6a)}
.foe-name{position:absolute;top:-24px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.fighter.hit{animation:hit .5s}

<script>'use strict';
/* ====================== Outils ====================== */
const $ = (s, r = document) => r.querySelector(s);

const rnd = n => Math.floor(Math.random() * n);

/* ====================== Sauvegarde ====================== */
const KEY = 'ptits-compagnons-v1';
const EXOS = [

  { id: 'lettres', label: 'Lettres majuscules' },
  { id: 'trace', label: 'Tracer rond / carré / triangle' },
  { id: 'formes', label: 'Reconnaître les formes' },
  { id: 'couleurs', label: 'Couleurs' },
  { id: 'compter', label: 'Dénombrer (1 à 5)' },
  { id: 'taille', label: 'Grand / petit' },
  { id: 'suites', label: 'Algorithmes (suites)' },
  { id: 'positions', label: 'Positions (sur, sous, dans)' },
  { id: 'puzzle', label: 'Puzzle (pièce manquante)' },
];
function defaultState() {
  return {
    v: 1, name: '', companion: null, xp: 0, stage: 1, cards: {}, packs: 0, sessions: 0,
    settings: { exos: Object.fromEntries(EXOS.map(e => [e.id, true])), rate: 0.9, music: true, len: 6, voice: '', start: 1, subs: true },
    lv: {}, firstRun: true,

}
let S = defaultState();
function save() {
  S.savedAt = Date.now();
  const txt = JSON.stringify(S);
  try { localStorage.setItem(KEY, txt); } catch (e) { }
  idbPut(txt);
}
/* Copie de secours dans IndexedDB (si localStorage est vidé ou indisponible) */
let _idb = null;
function idbOpen() {
  if (_idb) return _idb;
  _idb = new Promise((res, rej) => { try { const r = indexedDB.open('ptits-compagnons', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });
  _idb.catch(() => { });
  return _idb;
}
function idbPut(txt) { idbOpen().then(db => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(txt, KEY); }).catch(() => { }); }
function idbGet() { return idbOpen().then(db => new Promise(res => { const r = db.transaction('kv').objectStore('kv').get(KEY); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); })).catch(() => null); }
function applySaved(raw) {
  const d = JSON.parse(raw), base = defaultState(), defSettings = base.settings;
  S = Object.assign(base, d);
  S.settings = Object.assign(defSettings, d.settings || {});
  S.settings.exos = Object.assign(Object.fromEntries(EXOS.map(e => [e.id, true])), (d.settings || {}).exos || {});
}
/* ---- Code de sauvegarde (transfert vers un autre téléphone) ----
   Format : PC1-<somme de contrôle>-<données>  (données = JSON compressé puis base64url) */
const b64u = bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64u = str => { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; const b = atob(str), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };

async function zipBytes(u8, inflate) {
  const cs = inflate ? new DecompressionStream('deflate-raw') : new CompressionStream('deflate-raw');
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer());
}
async function exportCode() {
  const d = JSON.parse(JSON.stringify(S)); delete d.run; d.settings.voice = '';
  const raw = new TextEncoder().encode(JSON.stringify(d));
  let tag = 'PC1', data;
  if (window.CompressionStream) { try { data = b64u(await zipBytes(raw, false)); } catch (e) { } }
  if (!data) { tag = 'PC0'; data = b64u(raw); }
  return `${tag}-${sum(data)}-${data}`;
}
async function importCode(code) {
  const c = (code || '').replace(/\s+/g, '');
  const m = c.match(/^(PC[01])-([0-9a-z]{4})-([A-Za-z0-9_-]+)$/);
  if (!m) throw new Error('Ce code n\'est pas reconnu. Vérifie que tout le code a été collé, de « PC » jusqu\'à la fin.');
  if (sum(m[3]) !== m[2]) throw new Error('Le code est incomplet ou abîmé. Recopie-le en entier depuis l\'autre téléphone.');
  let bytes = unb64u(m[3]);
  if (m[1] === 'PC1') { if (!window.DecompressionStream) throw new Error('Ce navigateur est trop ancien pour lire ce code. Mets Chrome à jour.'); bytes = await zipBytes(bytes, true); }
  const d = JSON.parse(new TextDecoder().decode(bytes));
  if (!d || typeof d !== 'object' || !('xp' in d) || !('cards' in d)) throw new Error('Ce code ne contient pas de sauvegarde du jeu.');

}
/* Au démarrage : on garde la sauvegarde la plus récente entre localStorage et IndexedDB */
async function loadBest() {
  let ls = null; try { ls = localStorage.getItem(KEY); } catch (e) { }
  const db = await Promise.race([idbGet(), sleep(1500).then(() => null)]);
  const when = r => { try { return JSON.parse(r).savedAt || 0; } catch (e) { return -1; } };
  const best = [ls, db].filter(Boolean).sort((a, b) => when(b) - when(a))[0];
  if (best) { try { applySaved(best); } catch (e) { } }
  if (best && best !== ls) { try { localStorage.setItem(KEY, best); } catch (e) { } }
}
function lvl(id) { if (!S.lv[id]) S.lv[id] = { l: S.settings.start || 1, st: 0, miss: 0, n: 0, ok: 0 }; return S.lv[id]; }

/* ====================== Sons (WebAudio, aucun fichier) ====================== */
const Snd = {
  ctx: null, master: null, musicGain: null, playing: false, timer: null,
  init() {

      const AC = window.AudioContext || window.webkitAudioContext; this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = .9; this.master.connect(this.ctx.destination);

  tone(f, t0, dur, type = 'sine', vol = .2, dest) {

    g.gain.exponentialRampToValueAtTime(.0008, t0 + dur); o.connect(g); g.connect(dest || this.master); o.start(t0); o.stop(t0 + dur + .05);
  },
  seq(notes, step = .09, type = 'triangle', vol = .18, dur = .35) {
    if (!this.ctx) return; const t = this.ctx.currentTime + .02;
    notes.forEach((f, i) => f && this.tone(f, t + i * step, dur, type, vol));
  },
  good() { this.seq([523, 659, 784, 1047], .08, 'triangle', .2); this.seq([1568, 2093], .08, 'sine', .05, .5); },
  soft() { this.seq([392, 330], .14, 'sine', .12, .3); },
  tap() { this.seq([880], .05, 'sine', .08, .12); },
  win() { this.seq([523, 659, 784, 659, 784, 1047, 1319], .11, 'triangle', .2, .45); },
  sparkle() { this.seq([1319, 1568, 1760, 2093, 2637], .06, 'sine', .07, .4); },
  gold() { this.seq([784, 988, 1175, 1568, 1976, 2349, 3136], .07, 'triangle', .16, .6); setTimeout(() => this.win(), 500); },
  whoosh() {
    if (!this.ctx) return; const c = this.ctx, len = c.sampleRate * .6, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) * .5;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = b; f.type = 'bandpass';
    f.frequency.setValueAtTime(400, c.currentTime); f.frequency.exponentialRampToValueAtTime(3000, c.currentTime + .5); g.gain.value = .35;
    s.connect(f); f.connect(g); g.connect(this.master); s.start();
  },
  rise(dur = 3) {
    if (!this.ctx) return; const c = this.ctx, o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = 'sine'; o2.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(1320, t + dur);
    o2.frequency.setValueAtTime(330, t); o2.frequency.exponentialRampToValueAtTime(1980, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.09, t + .4); g.gain.linearRampToValueAtTime(.12, t + dur - .1); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); o2.connect(g); g.connect(this.master); o.start(t); o2.start(t); o.stop(t + dur + .1); o2.stop(t + dur + .1);
  },
  fanfare() { this.seq([523, 523, 523, 659, 0, 587, 659, 784, 0, 1047], .13, 'triangle', .2, .5); this.seq([262, 0, 0, 330, 0, 294, 330, 392, 0, 523], .13, 'sine', .12, .6); },
  /* Musique d'aventure chiptune, composée ici et jouée en direct (aucun fichier) :
     grille do – la m – fa – sol, 124 bpm, sections A A B B. */
  noiseBuf() {
    if (this._nb) return this._nb; const c = this.ctx, b = c.createBuffer(1, c.sampleRate * .5, c.sampleRate), d = b.getChannelData(0);

  noise(t, dur, vol, freq = 6000, type = 'highpass', dest) {

  kick(t, dest) {

    g.gain.setValueAtTime(.16, t); g.gain.exponentialRampToValueAtTime(.001, t + .18); o.connect(g); g.connect(dest); o.start(t); o.stop(t + .2);

  song: {
    lead: {
      A: [72, 0, 76, 0, 79, 0, 76, 0, 77, 76, 74, 0, 72, 0, 0, 0, 69, 0, 72, 0, 76, 0, 72, 0, 74, 72, 71, 0, 69, 0, 0, 0,
        69, 0, 72, 0, 77, 0, 76, 0, 74, 0, 72, 0, 74, 0, 76, 0, 79, 0, 0, 77, 76, 0, 74, 0, 71, 0, 74, 0, 79, 0, 0, 0],
      B: [84, 0, 79, 0, 76, 79, 84, 0, 83, 0, 79, 0, 76, 0, 74, 0, 81, 0, 76, 0, 72, 76, 81, 0, 79, 0, 76, 0, 72, 0, 0, 0,
        77, 0, 81, 0, 84, 0, 81, 0, 79, 0, 77, 0, 76, 0, 74, 0, 74, 0, 76, 0, 77, 0, 79, 0, 83, 0, 0, 0, 86, 0, 0, 0],
    },
    chords: [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]],

  startMusic() {
    if (!this.ctx || this.playing) return; this.playing = true;

/* ====================== Voix (speechSynthesis du téléphone) ====================== */
const Voice = {
  v: null, list: [],
  score(v) {
    let s = 0; const n = (v.name || '').toLowerCase(), l = (v.lang || '').toLowerCase().replace('_', '-');
    if (l === 'fr-fr') s += 20; else if (l.startsWith('fr')) s += 10; else return -99;
    if (v.localService) s += 6;                       // voix du téléphone, pas de voix en ligne
    if (/google/.test(n)) s += 4;
    if (/(natural|neural|online|wavenet|premium)/.test(n)) s -= 12; // voix neuronales : mauvaises sur les lettres isolées
    if (/(amélie|amelie|thomas|audrey|marie|julie|hortense|denise|fran)/.test(n)) s += 2;
    if (/(compact|eloquence)/.test(n)) s -= 3;
    return s;
  },
  refresh() {
    if (!('speechSynthesis' in window)) return;
    this.list = speechSynthesis.getVoices().filter(v => (v.lang || '').toLowerCase().startsWith('fr'));
    const chosen = this.list.find(v => v.voiceURI === S.settings.voice);
    this.v = chosen || this.list.slice().sort((a, b) => this.score(b) - this.score(a))[0] || null;
  },
  init() {
    if (!('speechSynthesis' in window)) return;
    this.refresh(); speechSynthesis.onvoiceschanged = () => this.refresh();
  },
  token: 0,
  say(text, opts = {}) {
    const tk = ++this.token;
    return new Promise(res => {
      if (!('speechSynthesis' in window) || !text) { if (text) { Caption.show(text); setTimeout(() => { if (tk === this.token) Caption.hide(); res(true); }, 900 + text.length * 45); } else setTimeout(res, 300); return; }
      try { speechSynthesis.cancel(); } catch (e) { }
      Caption.show(text);
      const u = new SpeechSynthesisUtterance(text);
      if (!this.v) this.refresh();
      try { if (this.v) u.voice = this.v; } catch (e) { } u.lang = 'fr-FR';
      u.rate = (opts.rate || 1) * S.settings.rate; u.pitch = opts.pitch || 1.05; u.volume = 1;
      let done = false; const fin = () => { if (done) return; done = true; Snd.duck(false); if (tk === this.token) Caption.hide(); res(tk === this.token); };
      u.onend = fin; u.onerror = fin;
      setTimeout(fin, 1600 + text.length * 95 / u.rate);
      Snd.duck(true);
      setTimeout(() => { try { speechSynthesis.speak(u); } catch (e) { fin(); } }, 40);
    });
  },
  stop() { this.token++; try { speechSynthesis.cancel(); } catch (e) { } Snd.duck(false); Caption.hide(); },
};
const say = (t, o) => Voice.say(t, o);
/* Sous-titres : ce que dit la voix s'affiche aussi (utile sans son ou sans voix française) */
const Caption = {
  t: 0,
  show(text) { const c = $('#cap'); if (!c || S.settings.subs === false) return; clearTimeout(this.t); c.textContent = text; c.classList.add('on'); },
  hide() { const c = $('#cap'); if (!c) return; clearTimeout(this.t); this.t = setTimeout(() => c.classList.remove('on'), 700); },
};

/* ====================== Confettis ====================== */
const Confetti = {
  cv: null, cx: null, parts: [], raf: 0,
  init() { this.cv = $('#confetti'); this.cx = this.cv.getContext('2d'); const r = () => { this.cv.width = innerWidth * devicePixelRatio; this.cv.height = innerHeight * devicePixelRatio; }; r(); addEventListener('resize', r); },
  burst(x, y, n = 60, power = 1, colors) {
    if (x == null) { x = innerWidth / 2; y = innerHeight / 3; }
    const cols = colors || ['#ff7a6b', '#ffc93c', '#7ed37a', '#5fb8ff', '#b28cff', '#ff9de2'];
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (3 + Math.random() * 7) * power;
      this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 5 * power, r: 4 + Math.random() * 5, c: pick(cols), rot: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 90 + rnd(50), sh: rnd(3) });
    }
    if (!this.raf) this.loop();
  },
  rain(n = 120) { for (let i = 0; i < n; i++) setTimeout(() => this.burst(Math.random() * innerWidth, -10, 1, .4), i * 15); },
  loop() {
    const c = this.cx, d = devicePixelRatio; c.clearRect(0, 0, this.cv.width, this.cv.height);
    this.parts = this.parts.filter(p => p.life-- > 0 && p.y < innerHeight + 40);
    for (const p of this.parts) {
      p.vy += .25; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      c.save(); c.translate(p.x * d, p.y * d); c.rotate(p.rot); c.fillStyle = p.c; c.globalAlpha = Math.min(1, p.life / 30);
      if (p.sh === 0) c.fillRect(-p.r * d, -p.r * d / 2, p.r * 2 * d, p.r * d);
      else if (p.sh === 1) { c.beginPath(); c.arc(0, 0, p.r * d * .8, 0, 7); c.fill(); }
      else { c.beginPath(); for (let k = 0; k < 10; k++) { const rr = (k % 2 ? .45 : 1) * p.r * d, a = k * Math.PI / 5; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.fill(); }
      c.restore();
    }
    this.raf = this.parts.length ? requestAnimationFrame(() => this.loop()) : 0;
    if (!this.raf) c.clearRect(0, 0, this.cv.width, this.cv.height);
  },
};

  const r = Math.random(), rar = r < .025 ? 'o' : r < .22 ? 'r' : 'c';
  const pool = CARDS.filter(c => c.rar === rar);
  const w = pool.map(c => (S.cards[c.id] ? 1 : 3));

/* ====================== Séance de jeu ====================== */
const Game = { active: false, recent: [], quit: false, curResolve: null, sid: 0 };
function planSession() {
  const on = EXOS.filter(e => S.settings.exos[e.id]).map(e => e.id);
  const ids = on.length ? on : ['chiffres'];
  const n = clamp(S.settings.len || 6, 5, 8), plan = [];
  let bag = [];
  while (plan.length < n) {
    if (!bag.length) bag = shuffle(ids);
    let i = bag.findIndex(x => x !== plan[plan.length - 1] && !(x === 'trace' && plan.includes('trace')));
    if (i < 0) { if (ids.length === 1 || (ids.length === 2 && ids.includes('trace') && plan.includes('trace'))) i = bag.findIndex(x => x !== 'trace' || !plan.includes('trace')); }
    if (i < 0) { bag = []; if (ids.every(x => x === 'trace')) { plan.push('trace'); } continue; }
    plan.push(bag.splice(i, 1)[0]);
  }
  return plan;
}
function makeQuestion(type) {
  const L = lvl(type).l;
  if (type === 'trace') return traceQuestion(L, Game.recent);
  let q;
  for (let k = 0; k < 14; k++) { q = GEN[type](L); if (!Game.recent.includes(q.key)) break; }
  return q;
}

  m.classList.remove('hop'); void m.offsetWidth; m.classList.add('hop'); setTimeout(() => svg.classList.remove('happy'), 1600);
}

      <div class="mid"><div class="dots">${plan.map(() => '<span class="dot"></span>').join('')}</div></div>

  let gained = 0;

  for (let i = i0; i < plan.length; i++) {
    if (gone()) return;
    $$('.dot', s).forEach((d, j) => { d.className = 'dot' + (j < i ? ' done' : j === i ? ' cur' : ''); });
    const type = plan[i], q = makeQuestion(type); current = q;

    else r = await runChoice(q, stage);
    if (gone()) return;

    record(type, r.first);
    const xp = r.first ? 10 : 5; gained += xp; S.xp += xp; S.run = { plan, i: i + 1 }; save();

function quitSession(silent) {

const Battle = {
  on: false, hp: 100, per: 20, foe: null,
  pickFoe() { const pool = CARDS.filter(c => /^f\d/.test(c.id) && c.rar !== 'o'); const f = pick(pool); preloadCreature(f.sp); return f; },

    const st = $('#pstage');
    st.innerHTML = `<div class="packcards">${cards.map(c => cardHTML(c, { anim: true })).join('')}</div>`;
    say('Touche les cartes pour les retourner !');
    let flipped = 0;
    $$('.packcards .card', st).forEach((el, i) => el.onclick = async () => {
      if (el.classList.contains('up')) { zoomCard(cards[i]); return; }
      el.classList.add('up'); flipped++;
      const c = cards[i];
      if (c.rar === 'o') {
        Snd.gold(); el.classList.add('gold-glow'); const r = el.getBoundingClientRect(); Confetti.burst(r.left + r.width / 2, r.top + r.height / 2, 120, 1.2);
        el.insertAdjacentHTML('afterbegin', '<div class="rays" style="z-index:-1"></div>');
        await say(`Waouh ! Une carte en or ! ${c.name} ! C'est incroyable !`);
      } else if (c.rar === 'r') { Snd.sparkle(); setTimeout(() => Snd.sparkle(), 200); await say(`Une carte rare ! ${c.name} !`); }
      else { Snd.sparkle(); await say(c.name + ' !'); }
      if (flipped === 3) {
        const a = $('#pafter');
        a.innerHTML = `<button class="big ok-btn" id="pOk" aria-label="Fini">${IC.check}</button>` + (S.packs > 0 ? `<button class="big square wiggle" id="pMore" aria-label="Encore un paquet">${IC.pack}<span class="badge">${S.packs}</span></button>` : '');
        $('#pOk').onclick = () => { Snd.tap(); screenHome(false); };
        if ($('#pMore')) $('#pMore').onclick = () => { Snd.tap(); screenPack(); };
      }
    });
  };
}

  <linearGradient id="pkf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <path d="M10 14 L20 6 L30 14 L40 6 L50 14 L60 6 L70 14 L80 6 L90 14 L100 6 L110 14 L120 6 L130 14 L140 6 L140 204 L10 204Z" fill="url(#pk)" stroke="#2d2350" stroke-width="4" stroke-linejoin="round"/>
  <rect x="10" y="30" width="130" height="10" fill="#ffc93c" stroke="#2d2350" stroke-width="3"/>

/* ---------- Collection ---------- */
function screenCards() {
  const s = $('#s-cards'); show('s-cards');
  const owned = CARDS.filter(c => S.cards[c.id]).length;
  s.innerHTML = `<div class="topbar"><button class="big round" id="bHome4" aria-label="Accueil">${IC.home}</button>
    <div class="mid" style="font-size:22px;font-weight:700;align-items:center">${IC.star().replace('<svg', '<svg style="width:28px"')} ${owned} / ${CARDS.length}</div>${musicBtn()}</div>
    ${owned < 3 ? `<div class="empty-msg">Termine une partie pour gagner un paquet de 3 cartes ! Les ombres sont les créatures à découvrir.</div>` : ''}
    <div class="scroll"><div class="cardgrid">${CARDS.map(c => S.cards[c.id] ? cardHTML(c, { up: true, count: S.cards[c.id] }) : `<div class="slot" role="img" aria-label="Carte à découvrir">${creatureSVG(c.sp, { lazy: true, still: true, noShadow: true, noFx: true, attrs: 'style="filter:brightness(0)"' })}</div>`).join('')}</div></div>`;
  bindMusic(s);
  $('#bHome4').onclick = () => { Snd.tap(); screenHome(false); };
  $$('.cardgrid .card', s).forEach(el => el.onclick = () => zoomCard(cardById(el.dataset.id)));
  say(owned < 3 ? 'Voici tes cartes ! Joue pour en gagner d\'autres !' : `Tu as ${owned} cartes ! Touche une carte pour la voir en grand.`);
}
function zoomCard(c) {
  const z = $('#zoom'); z.hidden = false;
  z.innerHTML = `${cardHTML(c, { anim: true })}<button class="big round" id="zClose" aria-label="Fermer">${IC.check.replace('#fff', '#2d2350')}</button>`;
  const el = $('.card', z); let canTilt = false;
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('up')));
  setTimeout(() => { canTilt = true; el.classList.add('tilting'); }, 850);
  Snd.sparkle();
  say(`${c.name}, créature ${c.el === 'eau' ? 'd\'eau' : c.el === 'eclair' ? 'éclair' : 'de ' + EL[c.el].nom} !` + (c.rar === 'o' ? ' Une carte en or !' : c.rar === 'r' ? ' Une carte rare !' : ''));
  const tilt = e => {
    if (!canTilt) return; const r = el.getBoundingClientRect();
    const x = clamp((e.clientX - r.left) / r.width, 0, 1), y = clamp((e.clientY - r.top) / r.height, 0, 1);
    el.style.setProperty('--ry', ((x - .5) * 30).toFixed(1) + 'deg'); el.style.setProperty('--rx', ((.5 - y) * 26).toFixed(1) + 'deg');
    el.style.setProperty('--gx', (x * 100) + '%'); el.style.setProperty('--gy', (y * 100) + '%');
  };
  const reset = () => { el.classList.remove('tilting'); el.style.setProperty('--rx', '0deg'); el.style.setProperty('--ry', '0deg'); setTimeout(() => canTilt && el.classList.add('tilting'), 820); };
  el.addEventListener('pointermove', tilt); el.addEventListener('pointerdown', tilt); el.addEventListener('pointerleave', reset); el.addEventListener('pointerup', reset);
  const close = () => { z.hidden = true; z.innerHTML = ''; };
  z.onclick = e => { if (e.target === z) close(); };
  $('#zClose').onclick = close; $('#zClose').focus({ preventScroll: true });
}
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#zoom').hidden) { $('#zoom').hidden = true; $('#zoom').innerHTML = ''; } });

/* ====================== Espace parent (appui long sur le soleil) ====================== */
function openParent() {
  Voice.stop(); const p = $('#parent'); p.hidden = false;
  const voices = Voice.list;
  p.innerHTML = `<h2>Espace parent</h2>

    <input type="text" id="pName" maxlength="20" value="${(S.name || '').replace(/"/g, '&quot;')}" autocomplete="off">
    <label for="pStart" style="display:block;margin-top:8px">Niveau de départ</label>
    <select id="pStart"><option value="1"${S.settings.start == 1 ? ' selected' : ''}>Petite section (3-4 ans)</option><option value="2"${S.settings.start == 2 ? ' selected' : ''}>Moyenne section (4-5 ans)</option></select>

  <section><h3>Voix et son</h3>
    <label for="pRate" style="display:block">Vitesse de la voix : <b id="pRateV">${S.settings.rate.toFixed(2)}</b></label>
    <input type="range" id="pRate" min="0.6" max="1.2" step="0.05" value="${S.settings.rate}">
    <label for="pVoice" style="display:block;margin-top:8px">Voix française du téléphone</label>
    <select id="pVoice"><option value="">Automatique (${Voice.v ? Voice.v.name : 'aucune voix trouvée'})</option>${voices.map(v => `<option value="${v.voiceURI.replace(/"/g, '&quot;')}"${S.settings.voice === v.voiceURI ? ' selected' : ''}>${v.name} (${v.lang}${v.localService ? '' : ', en ligne'})</option>`).join('')}</select>
    <div><button class="pbtn ghost" id="pTest">Tester la voix</button></div>
    <label><input type="checkbox" id="pMusic" ${S.settings.music ? 'checked' : ''}> Musique d'aventure</label>
    <label><input type="checkbox" id="pSubs" ${S.settings.subs !== false ? 'checked' : ''}> Sous-titres (affiche ce que dit la voix)</label></section>
  <section><h3>Progrès</h3><div class="stats">Compagnon : <b>${S.companion ? myForm().name : '—'}</b> (forme ${S.stage}/3, ${S.xp} points)<br>Séances terminées : ${S.sessions} · Cartes : ${CARDS.filter(c => S.cards[c.id]).length}/${CARDS.length}<br>
    ${EXOS.map(e => { const v = S.lv[e.id]; return v ? `${e.label} : niveau ${v.l}/3, ${v.ok}/${v.n} réussis du premier coup` : ''; }).filter(Boolean).join('<br>') || 'Pas encore de partie.'}</div></section>
  <section><h3>Paquets</h3><p class="small" id="pPacksTxt">${S.packs} paquet(s) en attente d'ouverture.</p><button class="pbtn ghost" id="pPacks">Supprimer les paquets en attente</button></section>
  <section><h3>Transférer la sauvegarde sur un autre téléphone</h3>
    <p class="small">1. Sur ce téléphone, copie le code ci-dessous (ou envoie-le par message).<br>2. Sur l'autre téléphone, ouvre le jeu, puis l'espace parent, colle le code dans la case « Charger » et valide.</p>
    <textarea id="pCode" readonly rows="4" style="width:100%;font:13px/1.35 ui-monospace,monospace;border-radius:10px;border:2px solid #d9d3f5;padding:8px;word-break:break-all;color:var(--ink);background:#faf9ff">Préparation du code…</textarea>
    <div><button class="pbtn" id="pCopy">Copier le code</button><button class="pbtn ghost" id="pShare" hidden>Envoyer…</button><span class="small" id="pCopyMsg" aria-live="polite"></span></div>
    <label for="pImport" style="display:block;margin-top:10px">Charger une sauvegarde (coller le code ici)</label>
    <textarea id="pImport" rows="3" placeholder="PC1-…" style="width:100%;font:13px/1.35 ui-monospace,monospace;border-radius:10px;border:2px solid #d9d3f5;padding:8px;color:var(--ink);background:#fff"></textarea>
    <div><button class="pbtn" id="pLoad">Charger cette sauvegarde</button><span id="pLoadConfirm" hidden><button class="pbtn warn" id="pLoad2">Oui, remplacer la partie de ce téléphone</button><button class="pbtn ghost" id="pLoadCancel">Annuler</button></span></div>
    <p class="small" id="pLoadMsg" aria-live="polite"></p></section>
  <section><h3>Remise à zéro</h3><p class="small">Efface le compagnon, les cartes, les points et les réglages.</p><button class="pbtn warn" id="pReset">Tout remettre à zéro</button><span id="pConfirm" hidden><button class="pbtn warn" id="pReset2">Oui, tout effacer</button><button class="pbtn ghost" id="pCancel">Annuler</button></span></section>
  <button class="pbtn" id="pClose" style="font-size:18px;padding:14px 22px;margin-bottom:30px">Retour au jeu</button>`;
  $('#pRate').oninput = e => { $('#pRateV').textContent = (+e.target.value).toFixed(2); };
  const apply = () => {
    S.name = $('#pName').value.trim().slice(0, 20);
    const st = +$('#pStart').value; if (st !== S.settings.start) { S.settings.start = st; Object.values(S.lv).forEach(v => { v.l = st; v.st = 0; v.miss = 0; }); }
    EXOS.forEach(e => S.settings.exos[e.id] = $('#ex-' + e.id).checked);
    if (!EXOS.some(e => S.settings.exos[e.id])) S.settings.exos.chiffres = true;
    S.settings.len = +$('#pLen').value; S.settings.rate = +$('#pRate').value;
    S.settings.voice = $('#pVoice').value; S.settings.music = $('#pMusic').checked; S.settings.subs = $('#pSubs').checked;

  exportCode().then(c => { $('#pCode').value = c; }).catch(() => { $('#pCode').value = 'Impossible de préparer le code.'; });
  $('#pCopy').onclick = async () => {
    const t = $('#pCode'), msg = $('#pCopyMsg');
    try { await navigator.clipboard.writeText(t.value); msg.textContent = ' Code copié !'; }
    catch (e) { t.focus(); t.select(); t.setSelectionRange(0, t.value.length); try { document.execCommand('copy'); msg.textContent = ' Code copié !'; } catch (_) { msg.textContent = ' Code sélectionné : fais « Copier ».'; } }
  };
  if (navigator.share) { $('#pShare').hidden = false; $('#pShare').onclick = () => navigator.share({ title: "Sauvegarde Mes p'tits compagnons", text: $('#pCode').value }).catch(() => { }); }
  let pending = null;

      pending = await importCode($('#pImport').value);
      const c = compById(pending.companion), f = c ? c.forms[(pending.stage || 1) - 1].name : 'pas encore de compagnon';
      msg.textContent = `Code valide : ${f}, ${pending.xp || 0} points, ${Object.keys(pending.cards || {}).length} cartes différentes${pending.name ? ', prénom ' + pending.name : ''}.`;

  $('#pLoadCancel').onclick = () => { $('#pLoadConfirm').hidden = true; pending = null; $('#pLoadMsg').textContent = ''; };
  $('#pLoad2').onclick = () => {
    if (!pending) return;
    applySaved(JSON.stringify(pending)); S.settings.voice = ''; S.run = null; S.firstRun = false; save(); Voice.refresh();
    p.hidden = true; Snd.sync(); S.companion ? screenHome(false) : screenChoose();
    say('La partie est chargée !');

  $('#pPacks').onclick = () => { S.packs = 0; save(); $('#pPacksTxt').textContent = 'Aucun paquet en attente.'; };
  $('#pReset').onclick = () => { $('#pConfirm').hidden = false; };
  $('#pCancel').onclick = () => { $('#pConfirm').hidden = true; };
  $('#pReset2').onclick = () => { S = defaultState(); save(); p.hidden = true; Snd.sync(); screenChoose(); };
  $('#pClose').onclick = () => { apply(); p.hidden = true; Snd.sync(); if (!Game.active) S.companion ? screenHome(false) : screenChoose(); };
}

/* ====================== Démarrage ====================== */
/* Bouton « retour » d'Android : il ne ferme plus le jeu */
let backGuarded = false;
function guardBack() {
  try {
    history.pushState({ jeu: 1 }, '');
    if (backGuarded) return; backGuarded = true;
    addEventListener('popstate', () => {
      try { history.pushState({ jeu: 1 }, ''); } catch (e) { }
      if (!$('#zoom').hidden) { $('#zoom').hidden = true; $('#zoom').innerHTML = ''; }
      else if (!$('#parent').hidden) { $('#pClose').click(); }
    });
  } catch (e) { }
}
/* Demande au navigateur de ne jamais effacer la sauvegarde */
function askPersist() { try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => { }); } catch (e) { } }
async function boot() {
  await loadBest(); Voice.init(); Confetti.init();
  S.stage = S.companion ? Math.max(S.stage, 1) : 1;
  screenStart();
  addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); Voice.stop(); Snd.stopMusic(); } else if (Snd.ctx) Snd.sync(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|anthropic/.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
}
boot();
